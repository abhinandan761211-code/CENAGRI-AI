# Netlify — frontend (static Vite build). Supabase handles auth + database;
# the FastAPI backend lives on Render and is reached via VITE_API_BASE_URL.
#
# Deploy: Netlify → "Add new site" → "Import an existing project" → pick the
# repo. Netlify reads this file, so no build settings are typed by hand.

[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ORDER MATTERS. Netlify applies the first matching rule, so the /api proxy
# MUST come before the SPA catch-all below. With the catch-all first, every
# /api/... request was answered with index.html (status 200) and never reached
# Render — which is exactly the "returning the app shell instead of JSON" the
# admin panel reports.
#
# Proxies /api/* to the Render backend. This is what makes the app work when
# VITE_API_BASE_URL is left at its "/api/v1" default.
#
# The host must be the REAL Render service URL (Render → service → the
# https://xxxx.onrender.com address). It used to point at
# `cenagri-api.onrender.com`, which hosts nothing: every /api call returned
# Render's plain-text "404 Not Found", the JSON parse failed, and the admin
# panel showed an empty page. The live service is `cenagri-ai.onrender.com`.
#
# `force = true`: nothing is ever served from a local /api path, so the proxy
# must win unconditionally. Otherwise Netlify can answer from the SPA fallback
# and the browser receives HTML where it expects JSON.
[[redirects]]
  from = "/api/*"
  to = "https://cenagri-ai.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback so /login, /signup, /dashboard, /equipment-owner, /auth/callback
# work on a direct load or refresh. Declared AFTER /api/* on purpose.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build assets never change, so cache them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html must always be revalidated, otherwise a deploy keeps serving the
# old app shell to returning visitors.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
